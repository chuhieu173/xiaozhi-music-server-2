services:
  - type: web
    name: lightweight-music-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: YOUTUBE_PLAYER_CLIENTS
        value: "tv_embedded,web_safari,android_vr"
